<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - VeFRA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f7fa;
            color: #333;
        }

        .error-card {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
            border-top: 5px solid #e74c3c;
        }

        h1 {
            color: #e74c3c;
            margin-top: 0;
        }

        .error-message {
            font-size: 1.1em;
            margin: 20px 0;
        }

        .error-details {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            font-family: monospace;
            font-size: 0.9em;
            overflow-x: auto;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <h1>Error</h1>
        <div class="error-message">
            {% if error.message %}
            {{ error.message }}
            {% else %}
            An unexpected error occurred.
            {% endif %}
        </div>

        {% if error.details %}
        <div class="error-details">
            {{ error.details }}
        </div>
        {% endif %}

        {% if not error.message and not error.details %}
        <div class="error-details">
            {{ error }}
        </div>
        {% endif %}
    </div>
</body>

</html>
